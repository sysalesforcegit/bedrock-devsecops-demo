name: Bedrock Salesforce CI/CD

# Trigger: on PR to develop or main when files in this project or common/ change.
# Monorepo pattern — each project has its own workflow with path-based triggers.
# This pipeline covers project-1 (and common/ shared components).
on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'force-app/**'      # project-1 core Salesforce metadata
      - 'common/**'         # shared components — triggers all project pipelines
      - 'omnistudio/**'     # shared OmniStudio DataPacks (OmniScripts, DataRaptors, FlexCards)
  push:
    branches: [develop]
    paths:
      - 'force-app/**'
      - 'common/**'
      - 'omnistudio/**'

jobs:
  validate-and-deploy:
    name: Static Analysis + Deploy + Apex Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Salesforce CLI
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli@latest
          sf --version

      # 3. Install SFDX Scanner plugin (PMD + Salesforce Code Analyzer)
      - name: Install SFDX Scanner
        run: echo y | sf plugins install @salesforce/sfdx-scanner

      # 4. Authenticate to CI org via JWT (no browser, no password)
      - name: Authenticate to CI Org (JWT)
        run: |
          echo "${{ secrets.SFDX_JWT_KEY }}" > server.key
          sf org login jwt \
            --client-id "${{ secrets.SFDX_CLIENT_ID }}" \
            --jwt-key-file server.key \
            --username "${{ secrets.SFDX_USERNAME }}" \
            --instance-url "${{ secrets.SFDX_INSTANCE_URL }}" \
            --alias CIOrg
          rm -f server.key
          sf org display --target-org CIOrg

      # 5. Static analysis — PMD scans all Apex for security and quality issues
      - name: Static Analysis (PMD via SFDX Scanner)
        run: |
          sf scanner run \
            --target force-app \
            --engine pmd \
            --format table \
            --severity-threshold 3
        # Severity 3 = Warning level. Only severity 1-2 (Critical/High) fail the build.
        # This will FAIL the build if any critical PMD rules are violated.

      # 6. Deploy all metadata to CI org
      - name: Deploy to CI Org
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org CIOrg \
            --test-level NoTestRun \
            --wait 20

      # 7. Deploy OmniStudio DataPacks (OmniScripts, DataRaptors, FlexCards)
      - name: Deploy OmniStudio DataPacks
        run: |
          if find omnistudio -name "*.json" | grep -q .; then
            echo "OmniStudio DataPacks found — installing plugin and deploying..."
            echo y | sf plugins install @salesforce/plugin-omnistudio
            sf omnistudio deploy datapack \
              --source-dir omnistudio/ \
              --target-org CIOrg
          else
            echo "No OmniStudio DataPacks found — skipping step"
          fi
        # OmniStudio metadata (OmniScripts, DataRaptors, FlexCards) is stored as JSON
        # DataPacks and deployed via the OmniStudio CLI plugin, NOT sf project deploy.
        # This step self-skips if the omnistudio/ folder has no DataPack JSON files.

      # 8. Run Apex tests separately after metadata is fully deployed
      - name: Run Apex Tests
        run: |
          sf apex test run \
            --class-names ServiceRequestHandlerTest \
            --target-org CIOrg \
            --result-format human \
            --code-coverage \
            --wait 10
        # Runs after deploy so all metadata (object, trigger, handler) is in place.
        # Fails the build if any test fails or coverage drops below 75%.
